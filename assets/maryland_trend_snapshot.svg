<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc"><title id="title">Maryland county-average income and Gini endpoints</title><desc id="desc">Approximate values published for 2012 and 2022: county-average household income rose from about 69 thousand dollars to over 90 thousand dollars, while mean county Gini rose from 0.423 to 0.440.</desc><rect width="1100" height="500" fill="#f8fafc"/><text x="64" y="64" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Maryland’s economic growth, in two indicators</text><text x="64" y="96" font-family="Arial,sans-serif" font-size="15" fill="#475569">Approximate 2012 and 2022 endpoints from the published analysis · ACS 5-year county estimates</text><rect x="58" y="130" width="476" height="278" rx="18" fill="#fff" stroke="#e2e8f0"/><rect x="566" y="130" width="476" height="278" rx="18" fill="#fff" stroke="#e2e8f0"/><text x="88" y="174" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">County-average median household income</text><text x="596" y="174" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">County-average Gini index</text><line x1="130" y1="330" x2="454" y2="330" stroke="#cbd5e1"/><line x1="638" y1="330" x2="962" y2="330" stroke="#cbd5e1"/><line x1="155" y1="292" x2="425" y2="228" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><circle cx="155" cy="292" r="9" fill="#2563eb"/><circle cx="425" cy="228" r="9" fill="#2563eb"/><line x1="663" y1="292" x2="933" y2="228" stroke="#d97706" stroke-width="5" stroke-linecap="round"/><circle cx="663" cy="292" r="9" fill="#d97706"/><circle cx="933" cy="228" r="9" fill="#d97706"/><text x="130" y="270" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">≈ $69k</text><text x="394" y="207" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">over $90k</text><text x="638" y="270" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#b45309">0.423</text><text x="902" y="207" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#b45309">0.440</text><text x="145" y="360" font-family="Arial,sans-serif" font-size="14" fill="#475569">2012</text><text x="415" y="360" font-family="Arial,sans-serif" font-size="14" fill="#475569">2022</text><text x="653" y="360" font-family="Arial,sans-serif" font-size="14" fill="#475569">2012</text><text x="923" y="360" font-family="Arial,sans-serif" font-size="14" fill="#475569">2022</text><text x="64" y="448" font-family="Arial,sans-serif" font-size="13" fill="#64748b">Equal-weighted mean of county estimates as described in the report; not a population-weighted statewide estimate.</text><text x="64" y="470" font-family="Arial,sans-serif" font-size="13" fill="#64748b">Only approximate endpoints are shown. Re-run the Census API workflow for complete year-by-year values.</text></svg>
